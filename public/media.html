<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Keo Sopharanith — Portfolio Media</title>
    <style>
        body {
            margin: 0;
            padding: 30px;
            background: #151214;
            color: #eee;
            font-family: Arial
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px
        }

        .card {
            border: 1px solid #393235;
            padding: 12px
        }

        .card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            background: #222
        }

        .label {
            padding: 12px 2px;
            color: #c91522;
            font-weight: bold
        }

        @media print {
            body {
                background: white;
                color: black
            }

            .grid {
                grid-template-columns: 1fr 1fr
            }
        }
    </style>
</head>

<body>
    <h1>Portfolio Media Library</h1>
    <p>Only existing visual assets currently in the project. Add real project screenshots to <b>assets/projects/</b>
        when ready.</p>
    <div class="grid">
        <div class="card"><img src="/assets/profile.jpg">
            <div class="label">PROFILE PHOTO</div>
        </div>
        <div class="card"><img src="/assets/certificate-uml.webp">
            <div class="label">UML CERTIFICATE</div>
        </div>
        <div class="card"><img src="/assets/certificate-java.webp">
            <div class="label">JAVA CERTIFICATE</div>
        </div>
    </div>
</body>

</html>
